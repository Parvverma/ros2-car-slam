ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true          # robot stays on a flat floor: ignore z, roll, pitch
    publish_tf: true          # EKF publishes TF odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # local fusion; SLAM handles "map"

    # Order: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,    # use forward speed only
                   false, false, false,    # ignore wheel yaw rate (slip)
                   false, false, false]
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,      # use gyro z (turn rate) only
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
